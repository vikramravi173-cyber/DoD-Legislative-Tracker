name: Sync Congress.gov data

on:
  schedule:
    # Daily at 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync bills from Congress.gov
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          CONGRESS_NUMBER: "119"
          SYNC_MAX_BILLS: "150"
          SYNC_MAX_PAGES: "10"
        run: python3 scripts/sync_congress.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bills.json
          if git diff --staged --quiet; then
            echo "No bill data changes to commit."
          else
            git commit -m "$(cat <<'EOF'
Refresh congressional bill data from Congress.gov.

EOF
)"
            git push
          fi
